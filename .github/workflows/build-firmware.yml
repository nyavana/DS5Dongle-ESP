name: Build firmware (reusable)

on:
  workflow_call:
    inputs:
      repo:
        description: owner/name to build. Empty = this repository.
        required: false
        type: string
        default: ""
      ref:
        description: Git ref, branch, tag, or SHA to build
        required: false
        type: string
        default: ""
      version:
        description: Firmware version string for artifact naming. Empty = commit/default.
        required: false
        type: string
        default: ""
      asset_suffix:
        description: Suffix added before artifact extensions, for example a release tag.
        required: false
        type: string
        default: ""
      upload_tag:
        description: If set, uploads built artifacts to this release tag.
        required: false
        type: string
        default: ""
      container_image:
        description: ESP-IDF image containing the esp32s31 preview target.
        required: false
        type: string
        default: ghcr.io/nyavana/ds5dongle-esp32s31-idf:master

jobs:
  build:
    name: Build ESP32-S31 firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repo == '' && github.repository || inputs.repo }}
          ref: ${{ inputs.ref }}
          submodules: false

      - name: Log in to GHCR
        if: startsWith(inputs.container_image, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve firmware version
        env:
          IN_VER: ${{ inputs.version }}
        run: |
          v="$IN_VER"
          if printf '%s' "$v" | grep -qE '^[0-9a-f]{40}$'; then
            v="${v:0:7}"
          fi
          echo "FW_VER=$v" >> "$GITHUB_ENV"

      - name: Build ESP32-S31 firmware
        env:
          TOOLCHAIN_IMAGE: ${{ inputs.container_image }}
        run: |
          if ! docker pull "$TOOLCHAIN_IMAGE"; then
            echo "::error title=Missing ESP-IDF S31 image::Run the 'Build ESP-IDF S31 container' workflow first to publish $TOOLCHAIN_IMAGE."
            exit 1
          fi
          docker run --rm -v "$PWD":/p -w /p "$TOOLCHAIN_IMAGE" \
            bash -lc 'idf.py --version && idf.py --preview set-target esp32s31 build'

      - name: Collect firmware artifacts
        env:
          ASSET_SUFFIX: ${{ inputs.asset_suffix }}
        run: |
          mkdir -p artifacts
          cp build/ds5dongle_esp32s31.bin "artifacts/ds5dongle_esp32s31${ASSET_SUFFIX}.bin"
          cp build/bootloader/bootloader.bin "artifacts/bootloader${ASSET_SUFFIX}.bin"
          cp build/partition_table/partition-table.bin "artifacts/partition-table${ASSET_SUFFIX}.bin"
          cp build/flasher_args.json "artifacts/flasher_args${ASSET_SUFFIX}.json"
          cp build/flash_args "artifacts/flash_args${ASSET_SUFFIX}.txt"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ds5dongle-esp32s31
          path: artifacts/*
          if-no-files-found: error

      - name: Attach artifacts to release
        if: inputs.upload_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.upload_tag }}
          files: artifacts/*
