name: Build ESP-IDF S31 container

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"
  push:
    paths:
      - .github/workflows/build-toolchain-image.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nyavana/ds5dongle-esp32s31-idf

jobs:
  build:
    name: Build and publish ESP-IDF S31 image
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/espressif/esp-idf.git#master:tools/docker
          push: true
          build-args: |
            IDF_CLONE_BRANCH_OR_TAG=master
            IDF_INSTALL_TARGETS=esp32s31
            IDF_CLONE_SHALLOW=1
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
